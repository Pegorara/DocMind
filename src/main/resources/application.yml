spring:
  application:
    name: docmind

  datasource:
    url: jdbc:postgresql://localhost:5433/${POSTGRES_DB:docmind}
    username: ${POSTGRES_USER:docmind}
    password: ${POSTGRES_PASSWORD:docmind}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        default_schema: public

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    com.pegorara.docmind: DEBUG
    org.hibernate.SQL: DEBUG
